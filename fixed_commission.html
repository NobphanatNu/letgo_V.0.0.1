<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Fixed Commission</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

<style>
body{font-family:Arial;background:#f4f4f4;padding:20px;}
table{width:100%;background:white;border-collapse:collapse;}
td,th{border:1px solid #ccc;padding:8px;text-align:center;}
button{padding:8px;margin-top:10px;}
</style>
</head>

<body>

<h2>ค่าคอมแบบตายตัว</h2>

<table id="tbl">
<tr>
<th>สินค้า</th>
<th>จำนวน</th>
<th>ค่าคอม/ชิ้น</th>
<th>รวม</th>
</tr>

<tr>
<td><input></td>
<td><input type="number" value="1" oninput="calc(this)"></td>
<td><input type="number" value="0" oninput="calc(this)"></td>
<td class="sum">0</td>
</tr>
</table>

<button onclick="add()">เพิ่ม</button>
<button onclick="exportExcel()">Export Excel</button>

<script>
function calc(el){
  let row=el.closest("tr");
  let qty=row.cells[1].querySelector("input").value||0;
  let price=row.cells[2].querySelector("input").value||0;
  row.querySelector(".sum").innerText=qty*price;
}

function add(){
  let table=document.getElementById("tbl");
  let row=table.insertRow();
  row.innerHTML=`
<td><input></td>
<td><input type="number" value="1" oninput="calc(this)"></td>
<td><input type="number" value="0" oninput="calc(this)"></td>
<td class="sum">0</td>`;
}

function exportExcel(){
  let wb=XLSX.utils.table_to_book(document.getElementById("tbl"));
  XLSX.writeFile(wb,"fixed_commission.xlsx");
}
</script>

</body>
</html>
