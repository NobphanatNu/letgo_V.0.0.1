<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<title>คำนวณค่าคอมตายตัว</title>

<link href="https://fonts.googleapis.com/css2?family=TH+Sarabun+New&display=swap" rel="stylesheet">

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  font-family: 'TH Sarabun New', sans-serif;
  background: #f4f4f9;
}

/* ===== HEADER ===== */
header {
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  height: 70px;
  background: #333;
  color: #fff;
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 0 20px;
  z-index: 1000;
}

.title {
  font-size: 20px;
  font-weight: bold;
}

nav a {
  color: white;
  text-decoration: none;
  margin-right: 15px;
  padding: 6px 12px;
  border-radius: 5px;
}

nav a.active,
nav a:hover {
  background: #555;
}

.user-area {
  display: flex;
  align-items: center;
  gap: 15px;
}

.logout {
  background: #e74c3c;
  padding: 6px 12px;
  border-radius: 5px;
  color: white;
  text-decoration: none;
}

.logout:hover {
  background: #c0392b;
}

/* ===== CONTENT ===== */
.container {
  margin-top: 90px;
  padding: 20px;
}

h1 {
  text-align: center;
  margin-bottom: 20px;
}

/* ===== TABLE ===== */
table {
  width: 100%;
  border-collapse: collapse;
  background: white;
}

th, td {
  border: 1px solid #ccc;
  padding: 8px;
  text-align: center;
}

th {
  background: #eee;
}

input {
  width: 100%;
  padding: 4px;
  text-align: center;
}

/* ===== BUTTONS ===== */
.btn {
  padding: 6px 12px;
  border: none;
  border-radius: 5px;
  cursor: pointer;
}

.add {
  background: #27ae60;
  color: white;
}

.delete {
  background: #e74c3c;
  color: white;
}

.add-row {
  margin-top: 15px;
  background: #2980b9;
  color: white;
}

/* ===== FOOTER ===== */
.footer {
  position: fixed;
  bottom: 15px;
  right: 20px;
  font-size: 16px;
  color: #444;
}
</style>
</head>

<body>

<header>
  <div>
    <div class="title">เว็บไซต์บันทึกและคำนวณค่าคอมมิชชั่น</div>
    <nav>
      <a href="/Dashboard.html">หน้าหลัก</a>
      <a href="/fixed_commission.html" class="active">คำนวณค่าคอมตายตัว</a>
      <a href="/percent_commission.html">คำนวณค่าคอมเปอร์เซ็นต์</a>
    </nav>
  </div>

  <div class="user-area">
    ผู้ใช้งาน: <strong>Admin</strong>
    <a href="/index.html" class="logout">Logout</a>
  </div>
</header>

<div class="container">
  <h1>คำนวณค่าคอมมิชชั่นแบบตายตัว</h1>

  <table id="commissionTable">
    <thead>
      <tr>
        <th>ลำดับ</th>
        <th>ชื่อสินค้า</th>
        <th>ราคาสินค้า</th>
        <th>ค่าคอมต่อชิ้น</th>
        <th>รวมค่าคอม</th>
        <th>จัดการ</th>
      </tr>
    </thead>
    <tbody>
      <tr>
        <td>1</td>
        <td><input type="text" placeholder="ชื่อสินค้า"></td>
        <td><input type="number" value="0"></td>
        <td><input type="number" value="0" oninput="calculate(this)"></td>
        <td class="total">0</td>
        <td>
          <button class="btn delete" onclick="deleteRow(this)">ลบ</button>
        </td>
      </tr>
    </tbody>
  </table>

  <button class="btn add-row" onclick="addRow()">➕ เพิ่มรายการ</button>
</div>

<div class="footer">© Nobphanat | Version 0.0.1</div>

<script>
function addRow() {
  const table = document.getElementById("commissionTable").getElementsByTagName("tbody")[0];
  const rowCount = table.rows.length;
  const row = table.insertRow();

  row.innerHTML = `
    <td>${rowCount + 1}</td>
    <td><input type="text" placeholder="ชื่อสินค้า"></td>
    <td><input type="number" value="0"></td>
    <td><input type="number" value="0" oninput="calculate(this)"></td>
    <td class="total">0</td>
    <td><button class="btn delete" onclick="deleteRow(this)">ลบ</button></td>
  `;
}

function deleteRow(btn) {
  const row = btn.parentNode.parentNode;
  row.remove();
  updateIndex();
}

function updateIndex() {
  const rows = document.querySelectorAll("#commissionTable tbody tr");
  rows.forEach((row, index) => {
    row.cells[0].innerText = index + 1;
  });
}

function calculate(input) {
  const row = input.parentNode.parentNode;
  const commission = input.value || 0;
  row.querySelector(".total").innerText = commission;
}
</script>

</body>
</html>
