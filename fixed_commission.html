<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<title>คอมตายตัว</title>

<link href="https://fonts.googleapis.com/css2?family=TH+Sarabun+New&display=swap" rel="stylesheet">

<style>
body{font-family:'TH Sarabun New',sans-serif;background:#f4f4f9;margin:0;}

header{
  position:fixed;top:0;left:0;width:100%;height:70px;
  background:#333;color:#fff;
  display:flex;justify-content:space-between;align-items:center;
  padding:0 20px;box-sizing:border-box;z-index:1000;
}

.left-area{display:flex;align-items:center;gap:30px;}
nav a{color:#ddd;text-decoration:none;padding:6px 12px;border-radius:5px;}
nav a:hover,nav a.active{background:#555;color:#fff;}

.container{
  max-width:400px;
  background:#fff;
  margin:120px auto;
  padding:25px;
  border-radius:10px;
}

input,button{width:100%;padding:10px;margin-top:10px;font-size:16px;}
button{background:#2ecc71;color:#fff;border:none;border-radius:5px;}
.result{text-align:center;margin-top:20px;font-size:20px;}
</style>
</head>

<body>

<header>
  <div class="left-area">
    <strong>คำนวณค่าคอมมิชชั่น</strong>
    <nav>
      <a href="/Dashboard.html">หน้าหลัก</a>
      <a href="/fixed_commission.html" class="active">คอมตายตัว</a>
      <a href="/percent_commission.html">คอมเปอร์เซ็นต์</a>
    </nav>
  </div>

  <div>
    ผู้ใช้งาน: <strong>Admin</strong>
    <a href="/index.html" style="margin-left:10px;color:#fff;">Logout</a>
  </div>
</header>

<div class="container">
  <h2>คำนวณค่าคอมตายตัว</h2>
  <input type="number" id="qty" placeholder="จำนวนที่ขายได้">
  <input type="number" id="commission" placeholder="ค่าคอมต่อชิ้น">
  <button onclick="calc()">คำนวณ</button>
  <div class="result" id="result"></div>
</div>

<script>
function calc(){
  let q = document.getElementById("qty").value;
  let c = document.getElementById("commission").value;
  document.getElementById("result").innerHTML =
    "ค่าคอมทั้งหมด = <b>" + (q*c).toLocaleString() + "</b> บาท";
}
</script>

</body>
</html>
