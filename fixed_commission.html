<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<title>คำนวณค่าคอมตายตัว</title>

<link href="https://fonts.googleapis.com/css2?family=TH+Sarabun+New&display=swap" rel="stylesheet">

<style>
body{
  font-family:'TH Sarabun New',sans-serif;
  background:#f4f4f9;
  margin:0;
}

/* ===== Header (เหมือน Dashboard) ===== */
header{
  position:fixed;
  top:0;
  left:0;
  width:100%;
  height:70px;
  background:#333;
  color:#fff;
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:0 20px;
  box-sizing:border-box;
  z-index:1000;
}

.left-area{
  display:flex;
  align-items:center;
  gap:30px;
}

.title{
  font-weight:bold;
}

nav a{
  color:#ddd;
  text-decoration:none;
  padding:6px 12px;
  border-radius:5px;
}

nav a:hover,
nav a.active{
  background:#555;
  color:#fff;
}

.user-area{
  display:flex;
  align-items:center;
  gap:15px;
}

.logout{
  background:#e74c3c;
  color:#fff;
  padding:6px 12px;
  border-radius:5px;
  text-decoration:none;
}

/* ===== Content ===== */
.container{
  max-width:400px;
  background:#fff;
  margin:130px auto 0;
  padding:25px;
  border-radius:10px;
  box-shadow:0 5px 15px rgba(0,0,0,0.1);
}

input,button{
  width:100%;
  padding:10px;
  margin-top:10px;
  font-size:16px;
}

button{
  background:#2ecc71;
  color:#fff;
  border:none;
  border-radius:5px;
}

.result{
  text-align:center;
  margin-top:20px;
  font-size:20px;
}

/* ===== Footer (ลายน้ำ) ===== */
.footer{
  position:fixed;
  bottom:10px;
  right:20px;
  font-size:14px;
  color:#666;
}
</style>
</head>

<body>

<header>
  <div class="left-area">
    <div class="title">เว็บไซต์บันทึกและคำนวณค่าคอมมิชชั่น</div>
    <nav>
      <a href="/Dashboard.html">หน้าหลัก</a>
      <a href="/fixed_commission.html" class="active">คำนวณค่าคอมตายตัว</a>
      <a href="/percent_commission.html">คำนวณค่าคอมเปอร์เซ็นต์</a>
    </nav>
  </div>

  <div class="user-area">
    ผู้ใช้งาน: <strong>Admin</strong>
    <a href="/index.html" class="logout">Logout</a>
  </div>
</header>

<div class="container">
  <h2>คำนวณค่าคอมตายตัว</h2>

  <input type="number" id="qty" placeholder="จำนวนที่ขายได้">
  <input type="number" id="commission" placeholder="ค่าคอมต่อชิ้น (บาท)">

  <button onclick="calculate()">คำนวณ</button>

  <div class="result" id="result"></div>
</div>

<div class="footer">© Nobphanat | Version 0.0.1</div>

<script>
function calculate(){
  let qty=document.getElementById("qty").value;
  let com=document.getElementById("commission").value;
  document.getElementById("result").innerHTML =
    "ค่าคอมทั้งหมด = <strong>" + (qty*com).toLocaleString() + "</strong> บาท";
}
</script>

</body>
</html>
