<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fixed Commission</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

<style>
body{
  margin:0;
  font-family:Arial, sans-serif;
  background:#f4f6f9;
}

/* Header */
header{
  background:#2c3e50;
  color:white;
  padding:15px 20px;
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.menu-btn{
  font-size:22px;
  cursor:pointer;
  margin-right:10px;
}

/* Sidebar */
.sidebar{
  position:fixed;
  top:0;
  left:-250px;
  width:250px;
  height:100%;
  background:#34495e;
  padding-top:60px;
  transition:.3s;
}

.sidebar a{
  display:block;
  padding:12px 20px;
  color:white;
  text-decoration:none;
}

.sidebar a:hover{
  background:#3f5c78;
}

.sidebar.show{
  left:0;
}

/* Content */
.container{
  padding:20px;
  max-width:900px;
  margin:auto;
}

table{
  width:100%;
  background:white;
  border-collapse:collapse;
  margin-top:15px;
}

td,th{
  border:1px solid #ccc;
  padding:10px;
  text-align:center;
}

input{
  width:100%;
  padding:6px;
  box-sizing:border-box;
}

button{
  padding:8px 14px;
  margin-top:10px;
  border:none;
  border-radius:6px;
  cursor:pointer;
}

.add-btn{background:#3498db;color:white;}
.export-btn{background:#27ae60;color:white;}
.logout-btn{background:#e74c3c;color:white;}

.footer{
  position:fixed;
  bottom:10px;
  right:15px;
  color:#666;
  font-size:13px;
}
</style>
</head>

<body>

<div id="sidebar" class="sidebar">
  <a href="dashboard.html">หน้าหลัก</a>
  <a href="fixed_commission.html">ค่าคอมตายตัว</a>
  <a href="percent_commission.html">ค่าคอมเปอร์เซ็นต์</a>
</div>

<header>
  <div>
    <span class="menu-btn" onclick="toggleMenu()">☰</span>
    ค่าคอมแบบตายตัว
  </div>
  <button class="logout-btn" onclick="logout()">Logout</button>
</header>

<div class="container">

<table id="tbl">
<tr>
<th>สินค้า</th>
<th>จำนวน</th>
<th>ค่าคอม/ชิ้น</th>
<th>รวม</th>
</tr>

<tr>
<td><input></td>
<td><input type="number" value="1" oninput="calc(this)"></td>
<td><input type="number" value="0" oninput="calc(this)"></td>
<td class="sum">0</td>
</tr>
</table>

<button class="add-btn" onclick="add()">เพิ่มแถว</button>
<button class="export-btn" onclick="exportExcel()">Export Excel</button>

</div>

<div class="footer">© Nobphanat | Version 0.1.1</div>

<script>

// ตรวจ Login
if(!localStorage.getItem("loginUser")){
  alert("กรุณา Login ก่อน");
  location="index.html";
}

function toggleMenu(){
  document.getElementById("sidebar").classList.toggle("show");
}

function logout(){
  localStorage.removeItem("loginUser");
  location="index.html";
}

function calc(el){
  let row=el.closest("tr");
  let qty=row.cells[1].querySelector("input").value||0;
  let price=row.cells[2].querySelector("input").value||0;
  row.querySelector(".sum").innerText=qty*price;
}

function add(){
  let table=document.getElementById("tbl");
  let row=table.insertRow();
  row.innerHTML=`
<td><input></td>
<td><input type="number" value="1" oninput="calc(this)"></td>
<td><input type="number" value="0" oninput="calc(this)"></td>
<td class="sum">0</td>`;
}

function exportExcel(){
  let wb=XLSX.utils.table_to_book(document.getElementById("tbl"));
  XLSX.writeFile(wb,"fixed_commission.xlsx");
}

</script>

</body>
</html>
