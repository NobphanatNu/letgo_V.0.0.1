<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<title>คำนวณค่าคอมตายตัว</title>

<link href="https://fonts.googleapis.com/css2?family=TH+Sarabun+New&display=swap" rel="stylesheet">

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  font-family: 'TH Sarabun New', sans-serif;
  background: #f4f4f9;
}

/* ===== HEADER ===== */
header {
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  height: 70px;
  background: #333;
  color: #fff;
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 0 20px;
  z-index: 1000;
}

.title {
  font-size: 20px;
  font-weight: bold;
}

nav a {
  color: white;
  text-decoration: none;
  margin-right: 15px;
  padding: 6px 12px;
  border-radius: 5px;
}

nav a.active,
nav a:hover {
  background: #555;
}

.user-area {
  display: flex;
  align-items: center;
  gap: 15px;
}

.logout {
  background: #e74c3c;
  padding: 6px 12px;
  border-radius: 5px;
  color: white;
  text-decoration: none;
}

.logout:hover {
  background: #c0392b;
}

/* ===== CONTENT ===== */
.container {
  margin-top: 90px;
  padding: 20px;
}

h1 {
  text-align: center;
  margin-bottom: 20px;
}

/* ===== TABLE ===== */
table {
  width: 100%;
  border-collapse: collapse;
  background: white;
}

th, td {
  border: 1px solid #ccc;
  padding: 8px;
  text-align: center;
}

th {
  background: #eee;
}

input {
  width: 100%;
  padding: 4px;
  text-align: center;
}

/* ===== QTY CONTROL ===== */
.qty-control {
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 5px;
}

.qty-control button {
  width: 28px;
  height: 28px;
  border: none;
  border-radius: 50%;
  cursor: pointer;
  background: #555;
  color: white;
  font-size: 16px;
}

.qty-control button:hover {
  background: #333;
}

/* ===== BUTTONS ===== */
.btn {
  padding: 6px 12px;
  border: none;
  border-radius: 5px;
  cursor: pointer;
}

.delete {
  background: #e74c3c;
  color: white;
}

.add-row {
  margin-top: 15px;
  background: #2980b9;
  color: white;
}

/* ===== FOOTER ===== */
.footer {
  position: fixed;
  bottom: 15px;
  right: 20px;
  font-size: 16px;
  color: #444;
}
</style>
</head>

<body>

<header>
  <div>
    <div class="title">เว็บไซต์บันทึกและคำนวณค่าคอมมิชชั่น</div>
    <nav>
      <a href="/Dashboard.html">หน้าหลัก</a>
      <a href="/fixed_commission.html" class="active">คำนวณค่าคอมตายตัว</a>
      <a href="/percent_commission.html">คำนวณค่าคอมเปอร์เซ็นต์</a>
    </nav>
  </div>

  <div class="user-area">
    ผู้ใช้งาน: <strong>Admin</strong>
    <a href="/index.html" class="logout">Logout</a>
  </div>
</header>

<div class="container">
  <h1>คำนวณค่าคอมมิชชั่นแบบตายตัว</h1>

  <table id="commissionTable">
    <thead>
      <tr>
        <th>ลำดับ</th>
        <th>ชื่อสินค้า</th>
        <th>ราคาสินค้า</th>
        <th>ค่าคอมต่อชิ้น</th>
        <th>จำนวนที่ขายได้</th>
        <th>รวมค่าคอม</th>
        <th>จัดการ</th>
      </tr>
    </thead>
    <tbody>
      <tr>
        <td>1</td>
        <td><input type="text" placeholder="ชื่อสินค้า"></td>
        <td><input type="number" value="0"></td>
        <td><input type="number" value="0" oninput="calculate(this)"></td>
        <td>
          <div class="qty-control">
            <button onclick="changeQty(this,-1)">➖</button>
            <input type="number" value="1" min="0" oninput="calculate(this)">
            <button onclick="changeQty(this,1)">➕</button>
          </div>
        </td>
        <td class="total">0</td>
        <td><button class="btn delete" onclick="deleteRow(this)">ลบ</button></td>
      </tr>
    </tbody>
  </table>

  <button class="btn add-row" onclick="addRow()">➕ เพิ่มรายการ</button>
</div>

<div class="footer">© Nobphanat | Version 0.0.1</div>

<script>
function addRow() {
  const tbody = document.querySelector("#commissionTable tbody");
  const index = tbody.rows.length + 1;

  const row = tbody.insertRow();
  row.innerHTML = `
    <td>${index}</td>
    <td><input type="text" placeholder="ชื่อสินค้า"></td>
    <td><input type="number" value="0"></td>
    <td><input type="number" value="0" oninput="calculate(this)"></td>
    <td>
      <div class="qty-control">
        <button onclick="changeQty(this,-1)">➖</button>
        <input type="number" value="1" min="0" oninput="calculate(this)">
        <button onclick="changeQty(this,1)">➕</button>
      </div>
    </td>
    <td class="total">0</td>
    <td><button class="btn delete" onclick="deleteRow(this)">ลบ</button></td>
  `;
}

function deleteRow(btn) {
  btn.closest("tr").remove();
  updateIndex();
}

function updateIndex() {
  document.querySelectorAll("#commissionTable tbody tr").forEach((row, i) => {
    row.cells[0].innerText = i + 1;
  });
}

function changeQty(btn, value) {
  const input = btn.parentNode.querySelector("input");
  let qty = parseInt(input.value) || 0;
  qty += value;
  if (qty < 0) qty = 0;
  input.value = qty;
  calculate(input);
}

function calculate(el) {
  const row = el.closest("tr");
  const commission = parseFloat(row.cells[3].querySelector("input").value) || 0;
  const qty = parseInt(row.cells[4].querySelector("input").value) || 0;
  row.querySelector(".total").innerText = commission * qty;
}
</script>

</body>
</html>
