<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<title>คำนวณค่าคอมตายตัว</title>
<link href="https://fonts.googleapis.com/css2?family=TH+Sarabun+New&display=swap" rel="stylesheet">

<style>
body { margin:0; font-family:'TH Sarabun New', sans-serif; background:#f4f4f9; }

/* ===== HEADER (เหมือน Dashboard) ===== */
header {
  position: fixed;
  top: 0; left: 0; right: 0;
  background: #333; color: white; z-index: 1000;
}

.header-top {
  display: flex; justify-content: space-between;
  align-items: center; padding: 12px 20px;
}

.title { font-size: 20px; font-weight: bold; }

.user-area { display: flex; gap: 15px; align-items: center; }

.logout {
  background: #e74c3c; padding: 6px 12px;
  border-radius: 5px; color: white; text-decoration: none;
}

.header-nav {
  display: flex; gap: 10px;
  padding: 8px 20px; background: #444;
}

.header-nav a {
  color: white; text-decoration: none;
  padding: 6px 14px; border-radius: 5px;
}

.header-nav a.active, .header-nav a:hover { background: #666; }

/* ===== CONTENT ===== */
.container { margin-top: 130px; padding: 20px; }

table {
  width: 100%; border-collapse: collapse; background: white;
}

th, td {
  border: 1px solid #ccc; padding: 8px; text-align: center;
}

th { background: #eee; }

.qty {
  display: flex; justify-content: center; gap: 5px;
}

.qty button {
  width: 28px; height: 28px;
  border: none; border-radius: 50%;
  background: #555; color: white; cursor: pointer;
}

.footer {
  position: fixed; bottom: 15px; right: 20px; color: #444;
}
</style>
</head>

<body>

<header>
  <div class="header-top">
    <div class="title">เว็บไซต์บันทึกและคำนวณค่าคอมมิชชั่น</div>
    <div class="user-area">
      ผู้ใช้งาน: <strong>Admin</strong>
      <a href="/index.html" class="logout">Logout</a>
    </div>
  </div>

  <nav class="header-nav">
    <a href="/Dashboard.html">หน้าหลัก</a>
    <a href="/fixed_commission.html" class="active">คำนวณค่าคอมตายตัว</a>
    <a href="/percent_commission.html">คำนวณค่าคอมเปอร์เซ็นต์</a>
  </nav>
</header>

<div class="container">
<h1>คำนวณค่าคอมตายตัว</h1>

<table id="tbl">
<tr>
<th>ลำดับ</th><th>สินค้า</th><th>ค่าคอม/ชิ้น</th>
<th>จำนวน</th><th>รวม</th><th>จัดการ</th>
</tr>
<tr>
<td>1</td>
<td><input></td>
<td><input type="number" value="0" oninput="calc(this)"></td>
<td class="qty">
  <button onclick="chg(this,-1)">-</button>
  <input type="number" value="1" oninput="calc(this)">
  <button onclick="chg(this,1)">+</button>
</td>
<td class="sum">0</td>
<td><button onclick="del(this)">ลบ</button></td>
</tr>
</table>

<button onclick="add()">➕ เพิ่มรายการ</button>
</div>

<div class="footer">© Nobphanat | Version 0.0.1</div>

<script>
function calc(e){
  let r=e.closest("tr");
  let c=+r.cells[2].querySelector("input").value||0;
  let q=+r.cells[3].querySelector("input").value||0;
  r.querySelector(".sum").innerText=c*q;
}
function chg(b,v){
  let i=b.parentNode.querySelector("input");
  i.value=Math.max(0,(+i.value||0)+v); calc(i);
}
function add(){
  let t=document.getElementById("tbl");
  let r=t.insertRow();
  let i=t.rows.length-1;
  r.innerHTML=`
<td>${i}</td>
<td><input></td>
<td><input type="number" value="0" oninput="calc(this)"></td>
<td class="qty">
<button onclick="chg(this,-1)">-</button>
<input type="number" value="1" oninput="calc(this)">
<button onclick="chg(this,1)">+</button>
</td>
<td class="sum">0</td>
<td><button onclick="del(this)">ลบ</button></td>`;
}
function del(b){ b.closest("tr").remove(); }
</script>

</body>
</html>
