<!DOCTYPE html>
<html lang="th">
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fixed Commission</title>

<script src="https://cdn.sheetjs.com/xlsx-latest/package/dist/xlsx.full.min.js"></script>

<style>
body{margin:0;font-family:Segoe UI;background:#f4f6fb;}
.header{background:#3f51b5;color:white;padding:15px;}
.container{padding:20px;}
table{width:100%;background:white;border-collapse:collapse;}
th,td{border:1px solid #ccc;padding:8px;text-align:center;}
button{padding:10px;margin-top:10px;}
</style>
</head>

<body>

<div class="header">ค่าคอมตายตัว</div>

<div class="container">

<table id="tbl">
<tr>
<th>สินค้า</th>
<th>ค่าคอม/ชิ้น</th>
<th>จำนวน</th>
<th>รวม</th>
</tr>

<tr>
<td><input></td>
<td><input type="number" oninput="calc(this)"></td>
<td><input type="number" oninput="calc(this)"></td>
<td class="sum">0</td>
</tr>

</table>

<button onclick="addRow()">เพิ่ม</button>
<button onclick="exportExcel()">Export Excel</button>

</div>

<script>
function calc(el){
let row=el.closest("tr");
let rate=row.cells[1].querySelector("input").value||0;
let qty=row.cells[2].querySelector("input").value||0;
row.querySelector(".sum").innerText=rate*qty;
}

function addRow(){
let tbl=document.getElementById("tbl");
let row=tbl.insertRow();
row.innerHTML=`
<td><input></td>
<td><input type="number" oninput="calc(this)"></td>
<td><input type="number" oninput="calc(this)"></td>
<td class="sum">0</td>`;
}

function exportExcel(){
let table=document.getElementById("tbl");
let wb=XLSX.utils.table_to_book(table);
XLSX.writeFile(wb,"commission_fixed.xlsx");
}
</script>

</body>
</html>
