<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard - Commission V0.1.1</title>

<style>
body{
  margin:0;
  font-family:Arial, sans-serif;
  background:#f4f6f9;
}

/* Header */
header{
  background:#2c3e50;
  color:white;
  padding:15px 20px;
  display:flex;
  justify-content:space-between;
  align-items:center;
}

/* Hamburger */
.menu-btn{
  font-size:22px;
  cursor:pointer;
  margin-right:10px;
}

/* Sidebar */
.sidebar{
  position:fixed;
  top:0;
  left:-250px;
  width:250px;
  height:100%;
  background:#34495e;
  padding-top:60px;
  transition:.3s;
}

.sidebar a{
  display:block;
  padding:12px 20px;
  color:white;
  text-decoration:none;
}

.sidebar a:hover{
  background:#3f5c78;
}

.sidebar.show{
  left:0;
}

.user-box{
  display:flex;
  align-items:center;
  gap:12px;
}

button{
  padding:8px 14px;
  border:none;
  background:#e74c3c;
  color:white;
  border-radius:6px;
  cursor:pointer;
}

/* Content */
.container{
  padding:20px;
  max-width:700px;
  margin:auto;
}

.card{
  background:white;
  padding:20px;
  border-radius:10px;
  margin-bottom:15px;
  cursor:pointer;
  box-shadow:0 3px 10px rgba(0,0,0,.1);
  font-size:18px;
  transition:.2s;
}

.card:hover{
  transform:translateY(-3px);
  box-shadow:0 8px 18px rgba(0,0,0,.15);
}

.footer{
  position:fixed;
  bottom:10px;
  right:15px;
  color:#666;
  font-size:13px;
}
</style>
</head>

<body>

<div id="sidebar" class="sidebar">
  <a href="dashboard.html">หน้าหลัก</a>
  <a href="fixed_commission.html">ค่าคอมตายตัว</a>
  <a href="percent_commission.html">ค่าคอมเปอร์เซ็นต์</a>
</div>

<header>
  <div>
    <span class="menu-btn" onclick="toggleMenu()">☰</span>
    Dashboard
  </div>

  <div class="user-box">
    <span id="welcome"></span>
    <button onclick="logout()">Logout</button>
  </div>
</header>

<div class="container">

<div class="card" onclick="location='fixed_commission.html'">
📦 Fixed Commission
</div>

<div class="card" onclick="location='percent_commission.html'">
📊 Percent Commission
</div>

</div>

<div class="footer">© Nobphanat | Version 0.1.1</div>

<script>
const user = localStorage.getItem("loginUser");

if(!user){
  alert("กรุณา Login ก่อน");
  location="index.html";
}

document.getElementById("welcome").innerText = "ผู้ใช้งาน: " + user;

function logout(){
  localStorage.removeItem("loginUser");
  location="index.html";
}

function toggleMenu(){
  document.getElementById("sidebar").classList.toggle("show");
}
</script>

</body>
</html>
