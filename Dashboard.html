<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<title>Dashboard</title>

<link href="https://fonts.googleapis.com/css2?family=TH+Sarabun+New&display=swap" rel="stylesheet">

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  font-family: 'TH Sarabun New', sans-serif;
  background: #f4f4f9;
}

/* ===== HEADER ===== */
header {
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  background: #333;
  color: white;
  z-index: 1000;
}

.header-top {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 12px 20px;
}

.title {
  font-size: 20px;
  font-weight: bold;
}

.user-area {
  display: flex;
  align-items: center;
  gap: 15px;
}

.logout {
  background: #e74c3c;
  padding: 6px 12px;
  border-radius: 5px;
  color: white;
  text-decoration: none;
}

.logout:hover {
  background: #c0392b;
}

.header-nav {
  display: flex;
  gap: 10px;
  padding: 8px 20px;
  background: #444;
}

.header-nav a {
  color: white;
  text-decoration: none;
  padding: 6px 14px;
  border-radius: 5px;
}

.header-nav a.active,
.header-nav a:hover {
  background: #666;
}

/* ===== CONTENT ===== */
.container {
  margin-top: 130px;
  padding: 20px;
  text-align: center;
}

h1 {
  margin-bottom: 10px;
}

.success-text {
  font-size: 22px;
  color: #27ae60;
  font-weight: bold;
}

/* ===== GIF ===== */
.dashboard-gif {
  margin-top: 25px;
  display: flex;
  justify-content: center;
}

.dashboard-gif img {
  max-width: 320px;
  width: 100%;
  border-radius: 14px;
  box-shadow: 0 8px 20px rgba(0,0,0,0.15);
}

/* ===== FOOTER ===== */
.footer {
  position: fixed;
  bottom: 15px;
  right: 20px;
  color: #444;
}
</style>
</head>

<body>

<header>
  <div class="header-top">
    <div class="title">เว็บไซต์บันทึกและคำนวณค่าคอมมิชชั่น</div>
    <div class="user-area">
      ผู้ใช้งาน: <strong>Admin</strong>
      <a href="/index.html" class="logout">Logout</a>
    </div>
  </div>

  <nav class="header-nav">
    <a href="/Dashboard.html" class="active">หน้าหลัก</a>
    <a href="/fixed_commission.html">คำนวณค่าคอมตายตัว</a>
    <a href="/percent_commission.html">คำนวณค่าคอมเปอร์เซ็นต์</a>
  </nav>
</header>

<div class="container">
  <h1>Dashboard</h1>
  <div class="success-text">คุณได้เข้าสู่ระบบเรียบร้อยแล้ว</div>

  <!-- GIF ใต้ข้อความ -->
  <div class="dashboard-gif">
    <img src="https://media.giphy.com/media/v1.Y2lkPWVjZjA1ZTQ3YTUxNXhwOXY5cGllZDh2MnRyMWtpZHYxdzEwenU0M2E3MjhtbzNjaCZlcD12MV9naWZzX3JlbGF0ZWQmY3Q9Zw/8PyTvI5EOu9LbAm8uS/giphy.gif"
         alt="Welcome Animation">
  </div>
</div>

<div class="footer">© Nobphanat | Version 0.0.1</div>

</body>
</html>
