<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <title>Dashboard</title>
  <!-- โหลดฟอนต์ TH Sarabun -->
  <link href="https://fonts.googleapis.com/css2?family=TH+Sarabun+New&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'TH Sarabun New', sans-serif;
      background: #f4f4f9;
      margin: 0;
      padding: 0;
    }
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #333;
      color: white;
      padding: 15px 20px;
    }
    header .title {
      font-size: 18px;
      font-weight: bold;
    }
    header button {
      background: #e74c3c;
      color: white;
      border: none;
      padding: 8px 15px;
      border-radius: 5px;
      cursor: pointer;
    }
    header button:hover { background: #c0392b; }
    .container {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      height: calc(100vh - 60px);
      text-align: center;
    }
    h1 { color: #333; margin-bottom: 10px; }
    p { color: #555; }
    .footer {
      position: fixed;
      bottom: 15px;
      right: 20px;
      font-size: 16px;
      color: #444;
    }
  </style>
</head>
<body>
  <header>
    <div class="title">เว็บไซต์บันทึกและคำนวณค่าคอมมิชชั่น</div>
    <button onclick="logout()">Logout</button>
  </header>

  <div class="container">
    <h1>ยินดีต้อนรับ, Nobphanat 🎉</h1>
    <p>คุณได้เข้าสู่ระบบเรียบร้อยแล้ว</p>
  </div>

  <div class="footer">
    © Nobphanat | Version 0.0.1
  </div>

  <script>
    function logout() {
      alert("คุณได้ออกจากระบบแล้ว");
      window.location.href = "index.html";
    }
  </script>
</body>
</html>
