<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<title>Dashboard</title>
<link href="https://fonts.googleapis.com/css2?family=TH+Sarabun+New&display=swap" rel="stylesheet">

<style>
body {
  margin: 0;
  font-family: 'TH Sarabun New', sans-serif;
  background: #f4f4f9;
}

/* ===== HEADER ===== */
header {
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  background: #333;
  color: white;
  z-index: 1000;
}

.header-top {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 12px 20px;
}

.title {
  font-size: 20px;
  font-weight: bold;
}

.user-area {
  display: flex;
  align-items: center;
  gap: 15px;
}

.logout {
  background: #e74c3c;
  padding: 6px 12px;
  border-radius: 5px;
  color: white;
  text-decoration: none;
}

.header-nav {
  display: flex;
  gap: 10px;
  padding: 8px 20px;
  background: #444;
}

.header-nav a {
  color: white;
  text-decoration: none;
  padding: 6px 14px;
  border-radius: 5px;
}

.header-nav a.active,
.header-nav a:hover {
  background: #666;
}

/* ===== CONTENT ===== */
.container {
  margin-top: 130px;
  text-align: center;
}

.footer {
  position: fixed;
  bottom: 15px;
  right: 20px;
  color: #444;
}
</style>
</head>

<body>

<header>
  <div class="header-top">
    <div class="title">เว็บไซต์บันทึกและคำนวณค่าคอมมิชชั่น</div>
    <div class="user-area">
      ผู้ใช้งาน: <strong>Admin</strong>
      <a href="/index.html" class="logout">Logout</a>
    </div>
  </div>

  <nav class="header-nav">
    <a href="/Dashboard.html" class="active">หน้าหลัก</a>
    <a href="/fixed_commission.html">คำนวณค่าคอมตายตัว</a>
    <a href="/percent_commission.html">คำนวณค่าคอมเปอร์เซ็นต์</a>
  </nav>
</header>

<div class="container">
  <h1>ยินดีต้อนรับ 🎉</h1>
  <p>คุณได้เข้าสู่ระบบเรียบร้อยแล้ว</p>
</div>

<div class="footer">© Nobphanat | Version 0.0.1</div>

</body>
</html>
