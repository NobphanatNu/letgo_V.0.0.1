<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <title>หน้าหลัก</title>

  <!-- ฟอนต์ TH Sarabun -->
  <link href="https://fonts.googleapis.com/css2?family=TH+Sarabun+New&display=swap" rel="stylesheet">

  <style>
    body {
      font-family: 'TH Sarabun New', sans-serif;
      background: #f4f4f9;
      margin: 0;
      padding: 0;
    }

    /* ===== Header ===== */
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #333;
      color: white;
      padding: 15px 20px;
    }

    .left-area {
      display: flex;
      align-items: center;
      gap: 30px;
    }

    .title {
      font-size: 18px;
      font-weight: bold;
    }

    /* ===== Menu ===== */
    nav a {
      color: #ddd;
      text-decoration: none;
      font-size: 16px;
      padding: 6px 12px;
      border-radius: 5px;
    }

    nav a:hover,
    nav a.active {
      background: #555;
      color: #fff;
    }

    /* ===== User Area ===== */
    .user-area {
      display: flex;
      align-items: center;
      gap: 15px;
    }

    .username {
      font-size: 16px;
      color: #f1f1f1;
    }

    .logout {
      background: #e74c3c;
      color: white;
      padding: 8px 15px;
      border-radius: 5px;
      text-decoration: none;
    }

    .logout:hover {
      background: #c0392b;
    }

    /* ===== Content ===== */
    .container {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      height: calc(100vh - 80px);
      text-align: center;
    }

    h1 {
      color: #333;
      margin-bottom: 10px;
    }

    p {
      color: #555;
    }

    /* ===== Footer ===== */
    .footer {
      position: fixed;
      bottom: 15px;
      right: 20px;
      font-size: 16px;
      color: #444;
    }
  </style>
</head>
<body>

<header>
  <div class="left-area">
    <div class="title">เว็บไซต์บันทึกและคำนวณค่าคอมมิชชั่น</div>

    <nav>
      <a href="dashboard.html" class="active">หน้าหลัก</a>
      <a href="fixed_commission.html">คำนวณค่าคอมตายตัว</a>
      <a href="percent_commission.html">คำนวณค่าคอมเปอร์เซ็นต์</a>
    </nav>
  </div>

  <div class="user-area">
    <span class="username">ผู้ใช้งาน: <strong>Admin</strong></span>
    <a href="index.html" class="logout">Logout</a>
  </div>
</header>

<div class="container">
  <h1>ยินดีต้อนรับ, Admin 🎉</h1>
  <p>เลือกฟังก์ชันจากเมนูด้านบนเพื่อเริ่มคำนวณค่าคอมมิชชั่น</p>
</div>

<div class="footer">© Nobphanat | Version 0.0.1</div>

</body>
</html>
