<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard - Commission V0.1.1</title>

<style>
body{
  margin:0;
  font-family:Arial, sans-serif;
  background:#f4f6f9;
}

/* Header */
header{
  background:#2c3e50;
  color:white;
  padding:15px 20px;
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.user-box{
  display:flex;
  align-items:center;
  gap:12px;
}

button{
  padding:8px 14px;
  border:none;
  background:#e74c3c;
  color:white;
  border-radius:6px;
  cursor:pointer;
}

button:hover{
  background:#c0392b;
}

/* Content */
.container{
  padding:20px;
  max-width:700px;
  margin:auto;
}

.card{
  background:white;
  padding:20px;
  border-radius:10px;
  margin-bottom:15px;
  cursor:pointer;
  box-shadow:0 3px 10px rgba(0,0,0,.1);
  font-size:18px;
  transition:.2s;
}

.card:hover{
  transform:translateY(-3px);
  box-shadow:0 8px 18px rgba(0,0,0,.15);
}

.footer{
  text-align:center;
  margin-top:30px;
  color:#777;
  font-size:13px;
}
</style>
</head>

<body>

<header>
  <div>Dashboard</div>

  <div class="user-box">
    <span id="welcome"></span>
    <button onclick="logout()">Logout</button>
  </div>
</header>

<div class="container">

<div class="card" onclick="location='fixed_commission.html'">
📦 คำนวณค่าคอมแบบตายตัว
</div>

<div class="card" onclick="location='percent_commission.html'">
📊 คำนวณค่าคอมแบบเปอร์เซ็นต์
</div>

<div class="footer">
Commission System V0.1.1
</div>

</div>

<script>

// ===== ป้องกันเข้าโดยไม่ Login =====
const user = localStorage.getItem("loginUser");

if(!user){
  alert("กรุณา Login ก่อน");
  location="index.html";
}

// แสดงชื่อผู้ใช้
document.getElementById("welcome").innerText = "ผู้ใช้งาน: " + user;

function logout(){
  localStorage.removeItem("loginUser");
  location="index.html";
}

</script>

</body>
</html>
