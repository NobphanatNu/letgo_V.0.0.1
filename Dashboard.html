<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard</title>

<style>
body{margin:0;font-family:Arial;background:#f4f6f9;}
header{background:#2c3e50;color:white;padding:15px;}
.container{padding:20px;}
.card{
  background:white;
  padding:20px;
  border-radius:10px;
  margin-bottom:15px;
  cursor:pointer;
  box-shadow:0 3px 10px rgba(0,0,0,.1);
}
button{padding:8px 12px;border:none;background:#e74c3c;color:white;border-radius:6px;}
</style>
</head>

<body>

<header>
<span id="welcome"></span>
<button onclick="logout()">Logout</button>
</header>

<div class="container">

<div class="card" onclick="location='fixed_commission.html'">
คำนวณค่าคอมแบบตายตัว
</div>

<div class="card" onclick="location='percent_commission.html'">
คำนวณค่าคอมแบบเปอร์เซ็นต์
</div>

</div>

<script>
document.getElementById("welcome").innerText =
"ผู้ใช้งาน: "+localStorage.getItem("loginUser");

function logout(){
  localStorage.removeItem("loginUser");
  location="index.html";
}
</script>

</body>
</html>
