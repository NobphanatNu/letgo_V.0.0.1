<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <title>เข้าสู่ระบบ</title>
  <!-- โหลดฟอนต์ TH Sarabun -->
  <link href="https://fonts.googleapis.com/css2?family=TH+Sarabun+New&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'TH Sarabun New', sans-serif;
      background: #f4f4f9;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }
    .container {
      text-align: center;
      background: #fff;
      padding: 30px;
      border-radius: 10px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
      width: 300px;
    }
    h1 { margin-bottom: 20px; color: #333; }
    input {
      width: 90%;
      margin: 8px 0;
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 5px;
    }
    button {
      width: 100%;
      padding: 10px;
      background: #4CAF50;
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
    }
    button:hover { background: #45a049; }
    p { margin-top: 15px; }
    a { color: #007BFF; text-decoration: none; }
    a:hover { text-decoration: underline; }
    .title { font-size: 18px; font-weight: bold; margin-bottom: 15px; color: #444; }
  </style>
</head>
<body>
  <div class="container">
    <div class="title">เว็บไซต์บันทึกและคำนวณค่าคอมมิชชั่น</div>
    <h1>เข้าสู่ระบบ</h1>
    <form id="loginForm">
      <input type="text" id="loginUsername" placeholder="ชื่อผู้ใช้" required>
      <input type="password" id="loginPassword" placeholder="รหัสผ่าน" required>
      <button type="submit">ล็อกอิน</button>
    </form>
    <p>ยังไม่มีบัญชี? <a href="register.html">สมัครสมาชิกที่นี่</a></p>
    <div id="result"></div>
  </div>

  <script>
    document.getElementById("loginForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const username = document.getElementById("loginUsername").value;
      const password = document.getElementById("loginPassword").value;

      const res = await fetch("http://localhost:3000/login", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ username, password })
      });

      const text = await res.text();
      if (text.includes("ล็อกอินสำเร็จ")) {
        window.location.href = "dashboard.html";
      } else {
        document.getElementById("result").innerText = text;
      }
    });
  </script>
</body>
</html>
