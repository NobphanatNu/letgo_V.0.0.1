<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login - Commission V0.1.1</title>

<link href="https://fonts.googleapis.com/css2?family=TH+Sarabun+New:wght@400;700&display=swap" rel="stylesheet">

<style>
body{
  margin:0;
  font-family:'TH Sarabun New', Arial, sans-serif;
  background:linear-gradient(135deg,#4facfe,#00f2fe);
  height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
}

.card{
  background:white;
  padding:32px;
  border-radius:14px;
  width:340px;
  box-shadow:0 10px 25px rgba(0,0,0,.2);
  text-align:center;
}

/* หัวข้อ */
.system-title{
  font-size:30px;
  font-weight:bold;
  margin-bottom:4px;
}

.system-subtitle{
  font-size:18px;
  color:#666;
  margin-bottom:16px;
}

.login-title{
  font-size:22px;
  margin-bottom:8px;
}

/* ช่องกรอกและปุ่ม */
input,button{
  width:100%;
  height:44px;
  padding:0 12px;
  margin-top:12px;
  border-radius:8px;
  border:1px solid #ccc;
  font-size:18px;
  box-sizing:border-box;
}

button{
  background:#4facfe;
  color:white;
  border:none;
  cursor:pointer;
  font-weight:bold;
}

button:hover{
  opacity:.9;
}

a{
  display:block;
  text-align:center;
  margin-top:12px;
  font-size:18px;
}

/* footer */
.footer{
  position:fixed;
  bottom:12px;
  right:18px;
  font-size:16px;
  color:#fff;
  opacity:.95;
}
</style>
</head>

<body>

<div class="card">

<div class="system-title">ระบบคำนวณคอมมิชชั่น</div>
<div class="system-subtitle">Commission Calculator System</div>
<div class="login-title">เข้าสู่ระบบ</div>

<input id="username" placeholder="Username" autocomplete="off">
<input id="password" type="password" placeholder="Password" autocomplete="off">

<button onclick="login()">Login</button>
<a href="register.html">สมัครใช้งาน</a>

</div>

<div class="footer">© Nobphanat | Version 0.1.1</div>

<script>
document.addEventListener("keydown", function(e){
  if(e.key === "Enter"){
    login();
  }
});

function login(){

  const user=document.getElementById("username").value.trim();
  const pass=document.getElementById("password").value.trim();

  if(!user || !pass){
    alert("กรุณากรอก Username และ Password");
    return;
  }

  if(user==="Admin" && pass==="@Admin"){
    localStorage.setItem("loginUser","Admin");
    window.location.href="dashboard.html";
    return;
  }

  let users=[];
  try{
    users=JSON.parse(localStorage.getItem("users")) || [];
  }catch(e){ users=[]; }

  const found=users.find(u => u.username===user && u.password===pass);

  if(found){
    localStorage.setItem("loginUser",user);
    window.location.href="dashboard.html";
  }else{
    alert("Username หรือ Password ไม่ถูกต้อง");
  }
}
</script>

</body>
</html>
