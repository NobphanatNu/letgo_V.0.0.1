<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <title>สมัครสมาชิก</title>
  <!-- โหลดฟอนต์ TH Sarabun -->
  <link href="https://fonts.googleapis.com/css2?family=TH+Sarabun+New&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'TH Sarabun New', sans-serif;
      background: #f4f4f9;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }
    .container {
      text-align: center;
      background: #fff;
      padding: 30px;
      border-radius: 10px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
      width: 300px;
    }
    h1 { margin-bottom: 20px; color: #333; }
    input {
      width: 90%;
      margin: 8px 0;
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 5px;
    }
    button {
      width: 100%;
      padding: 10px;
      background: #2196F3;
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
    }
    button:hover { background: #1976D2; }
    p { margin-top: 15px; }
    a { color: #007BFF; text-decoration: none; }
    a:hover { text-decoration: underline; }
    .title { font-size: 18px; font-weight: bold; margin-bottom: 15px; color: #444; }
    .footer {
      position: fixed;
      bottom: 15px;
      right: 20px;
      font-size: 16px;
      color: #444;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="title">เว็บไซต์บันทึกและคำนวณค่าคอมมิชชั่น</div>
    <h1>สมัครสมาชิก</h1>
    <form id="registerForm">
      <input type="text" id="regUsername" placeholder="ชื่อผู้ใช้" required>
      <input type="password" id="regPassword" placeholder="รหัสผ่าน" required>
      <button type="submit">สมัคร</button>
    </form>
    <p>มีบัญชีแล้ว? <a href="index.html">เข้าสู่ระบบที่นี่</a></p>
    <div id="result"></div>
  </div>

  <div class="footer">
    © Nobphanat | Version 0.0.1
  </div>

  <script>
    document.getElementById("registerForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const username = document.getElementById("regUsername").value;
      const password = document.getElementById("regPassword").value;

      const res = await fetch("http://localhost:3000/register", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ username, password })
      });
      document.getElementById("result").innerText = await res.text();
    });
  </script>
</body>
</html>
