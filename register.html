<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Commission</title>

  <link href="https://fonts.googleapis.com/css2?family=TH+Sarabun+New&display=swap" rel="stylesheet">

  <style>
    body {
      font-family:'TH Sarabun New', sans-serif;
      background:#f4f4f9;
      margin:0;
      padding:20px;
      display:flex;
      justify-content:center;
      align-items:center;
      min-height:100vh;
      box-sizing:border-box;
    }

    .container {
      text-align:center;
      background:#fff;
      padding:25px;
      border-radius:10px;
      box-shadow:0 0 10px rgba(0,0,0,0.1);
      width:100%;
      max-width:380px;
      box-sizing:border-box;
    }

    h1 {
      margin-bottom:15px;
    }

    p {
      font-size:18px;
      margin-bottom:20px;
    }

    button {
      width:100%;
      margin:8px 0;
      padding:10px;
      border-radius:5px;
      background:#2196F3;
      color:white;
      border:none;
      cursor:pointer;
      font-size:16px;
    }

    button:hover {
      background:#1976D2;
    }

    .footer {
      position:fixed;
      bottom:10px;
      right:15px;
      font-size:14px;
      color:#444;
      opacity:0.8;
    }

    @media (max-width:480px){
      .container {
        padding:20px;
      }
    }
  </style>
</head>

<body>

  <div class="container">
    <h1>สมัครสมาชิก</h1>
    <p>ยังไม่อนุญาตให้มีผู้สมัครเข้าใช้งาน Sorry!</p>

    <a href="index.html">
      <button>กลับไปเข้าสู่ระบบ</button>
    </a>
  </div>

  <div class="footer">
    © Nobphanat | Version 0.0.12
  </div>

</body>
</html>
