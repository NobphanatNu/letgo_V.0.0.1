<!DOCTYPE html>
<html lang="th">
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Register</title>
</head>

<body style="font-family:Segoe UI;background:#f4f6fb;display:flex;justify-content:center;align-items:center;height:100vh;">

<div style="background:white;padding:30px;border-radius:12px;width:320px;">
<h2>สมัครใช้งาน</h2>

<input id="user" placeholder="Username" style="width:100%;padding:12px;margin-top:10px;">
<input id="pass" type="password" placeholder="Password" style="width:100%;padding:12px;margin-top:10px;">

<button onclick="save()" style="width:100%;padding:12px;margin-top:10px;background:#4caf50;color:white;border:none;">สมัคร</button>
<button onclick="location='index.html'" style="width:100%;padding:12px;margin-top:10px;">กลับ</button>
</div>

<script>
function save(){
localStorage.user=user.value;
localStorage.pass=pass.value;
alert("สมัครสำเร็จ");
location="index.html";
}
</script>

</body>
</html>
