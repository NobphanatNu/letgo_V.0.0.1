<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>สมัครใช้งาน</title>

<style>
body{font-family:Arial;background:#f4f4f4;display:flex;justify-content:center;align-items:center;height:100vh;}
.card{background:white;padding:25px;border-radius:10px;width:320px;box-shadow:0 5px 15px rgba(0,0,0,.2);}
input,button{width:100%;padding:10px;margin-top:10px;}
button{background:#27ae60;color:white;border:none;border-radius:6px;}
</style>
</head>

<body>

<div class="card">
<h2>สมัครใช้งาน</h2>

<input id="username" placeholder="Username">
<input id="password" type="password" placeholder="Password">
<button onclick="register()">สมัครสมาชิก</button>
<button onclick="location='index.html'">กลับ</button>
</div>

<script>
function register(){
  const user=document.getElementById("username").value;
  const pass=document.getElementById("password").value;

  let users=JSON.parse(localStorage.getItem("users")||"[]");
  users.push({username:user,password:pass});
  localStorage.setItem("users",JSON.stringify(users));

  alert("สมัครสำเร็จ");
  location="index.html";
}
</script>

</body>
</html>
