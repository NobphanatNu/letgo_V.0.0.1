<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Percent Commission</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

<style>
body{margin:0;font-family:Arial;background:#f4f6f9;}

header{
  background:#34495e;
  color:white;
  padding:12px 20px;
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.menu-btn{cursor:pointer;font-size:20px;margin-right:10px;}
.container{padding:20px;max-width:900px;margin:auto;}

table{
  width:100%;
  border-collapse:collapse;
  background:white;
}

th,td{
  border:1px solid #ddd;
  padding:10px;
  text-align:center;
}

input{width:100%;padding:6px;}

button{
  padding:6px 10px;
  border:none;
  border-radius:6px;
  cursor:pointer;
}

.add-btn{background:#3498db;color:white;}
.export-btn{background:#27ae60;color:white;}
.delete-btn{background:#e74c3c;color:white;}
.qty-btn{background:#ddd;padding:4px 8px;margin:0 2px;}

.total-box{
  text-align:right;
  margin-top:10px;
  font-size:18px;
}

.side-menu{
  position:fixed;
  top:0;
  left:-220px;
  width:220px;
  height:100%;
  background:#2c3e50;
  padding-top:60px;
  transition:.3s;
}

.side-menu a{
  display:block;
  color:white;
  padding:12px 20px;
  text-decoration:none;
}

.side-menu a:hover{background:#34495e;}

.copyright{
  position:fixed;
  bottom:8px;
  right:12px;
  font-size:12px;
  color:#555;
}
</style>
</head>

<body>

<div id="sideMenu" class="side-menu">
<a href="dashboard.html">Dashboard</a>
<a href="fixed_commission.html">ค่าคอมตายตัว</a>
<a href="percent_commission.html">ค่าคอมเปอร์เซ็นต์</a>
</div>

<header>
<div>
<span class="menu-btn" onclick="toggleMenu()">☰</span>
Percent Commission
</div>

<div>
ผู้ใช้งาน: <span id="user"></span>
</div>
</header>

<div class="container">

<table id="tbl">
<tr>
<th>สินค้า</th>
<th>ราคา</th>
<th>%</th>
<th>จำนวน</th>
<th>ค่าคอม</th>
<th>ลบ</th>
</tr>

<tr>
<td><input></td>
<td><input type="number" value="0" oninput="calc(this)"></td>
<td><input type="number" value="0" oninput="calc(this)"></td>

<td>
<button class="qty-btn" onclick="changeQty(this,-1)">-</button>
<input type="number" value="1" oninput="calc(this)" style="width:50px;">
<button class="qty-btn" onclick="changeQty(this,1)">+</button>
</td>

<td class="sum">0</td>
<td><button class="delete-btn" onclick="removeRow(this)">X</button></td>
</tr>

</table>

<br>
<button class="add-btn" onclick="add()">เพิ่มแถว</button>
<button class="export-btn" onclick="exportExcel()">Export Excel</button>

<div class="total-box">
รวมทั้งหมด: <span id="grandTotal">0</span>
</div>

</div>

<div class="copyright">
© Nobphanat | Version 0.1.1
</div>

<script>

document.getElementById("user").innerText = localStorage.getItem("loginUser");

function toggleMenu(){
 let menu=document.getElementById("sideMenu");
 menu.style.left = menu.style.left==="0px" ? "-220px":"0px";
}

function calc(el){
 let row=el.closest("tr");
 let price=row.cells[1].querySelector("input").value||0;
 let percent=row.cells[2].querySelector("input").value||0;
 let qty=row.cells[3].querySelector("input").value||0;

 let total=price*qty*percent/100;
 row.querySelector(".sum").innerText=total.toFixed(2);
 totalAll();
}

function totalAll(){
 let sums=document.querySelectorAll(".sum");
 let total=0;
 sums.forEach(s=> total+=Number(s.innerText)||0);
 document.getElementById("grandTotal").innerText=total.toFixed(2);
}

function changeQty(btn,delta){
 let input=btn.parentElement.querySelector("input");
 input.value=Math.max(0,Number(input.value)+delta);
 calc(input);
}

function removeRow(btn){
 btn.closest("tr").remove();
 totalAll();
}

function add(){
 let table=document.getElementById("tbl");
 let row=table.insertRow();
 row.innerHTML=`
<td><input></td>
<td><input type="number" value="0" oninput="calc(this)"></td>
<td><input type="number" value="0" oninput="calc(this)"></td>
<td>
<button class="qty-btn" onclick="changeQty(this,-1)">-</button>
<input type="number" value="1" oninput="calc(this)" style="width:50px;">
<button class="qty-btn" onclick="changeQty(this,1)">+</button>
</td>
<td class="sum">0</td>
<td><button class="delete-btn" onclick="removeRow(this)">X</button></td>`;
}

function exportExcel(){
 let wb=XLSX.utils.table_to_book(document.getElementById("tbl"));
 XLSX.writeFile(wb,"percent_commission.xlsx");
}
</script>

</body>
</html>
