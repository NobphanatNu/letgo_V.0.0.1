<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Percent Commission - V0.1.1</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

<style>
body{
  margin:0;
  font-family:Arial, sans-serif;
  background:#f4f6f9;
}

/* Header */
header{
  background:#2c3e50;
  color:white;
  padding:15px 20px;
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.user-box{
  display:flex;
  align-items:center;
  gap:12px;
}

button{
  padding:8px 14px;
  border:none;
  border-radius:6px;
  cursor:pointer;
}

.logout{
  background:#e74c3c;
  color:white;
}

.logout:hover{
  background:#c0392b;
}

.container{
  padding:20px;
  max-width:900px;
  margin:auto;
}

table{
  width:100%;
  background:white;
  border-collapse:collapse;
  box-shadow:0 3px 10px rgba(0,0,0,.1);
}

td,th{
  border:1px solid #ccc;
  padding:10px;
  text-align:center;
}

th{
  background:#ecf0f1;
}

input{
  width:100%;
  padding:6px;
  box-sizing:border-box;
}

.actions{
  margin-top:15px;
  display:flex;
  gap:10px;
}

.add{
  background:#27ae60;
  color:white;
}

.export{
  background:#2980b9;
  color:white;
}

.delete{
  background:#e74c3c;
  color:white;
}
</style>
</head>

<body>

<header>
  <div>คำนวณค่าคอมแบบเปอร์เซ็นต์</div>

  <div class="user-box">
    <span id="welcome"></span>
    <button class="logout" onclick="logout()">Logout</button>
  </div>
</header>

<div class="container">

<table id="tbl">
<tr>
<th>สินค้า</th>
<th>ราคา</th>
<th>%</th>
<th>จำนวน</th>
<th>ค่าคอม</th>
<th>ลบ</th>
</tr>

<tr>
<td><input></td>
<td><input type="number" value="0" oninput="calc(this)"></td>
<td><input type="number" value="0" oninput="calc(this)"></td>
<td><input type="number" value="1" oninput="calc(this)"></td>
<td class="sum">0</td>
<td><button class="delete" onclick="delRow(this)">ลบ</button></td>
</tr>
</table>

<div class="actions">
<button class="add" onclick="add()">เพิ่มรายการ</button>
<button class="export" onclick="exportExcel()">Export Excel</button>
</div>

</div>

<script>

// ===== ป้องกันเข้าโดยไม่ Login =====
const user = localStorage.getItem("loginUser");

if(!user){
  alert("กรุณา Login ก่อน");
  location="index.html";
}

document.getElementById("welcome").innerText = "ผู้ใช้งาน: " + user;

function logout(){
  localStorage.removeItem("loginUser");
  location="index.html";
}

// ===== คำนวณ =====
function calc(el){
  let row=el.closest("tr");
  let price=row.cells[1].querySelector("input").value||0;
  let percent=row.cells[2].querySelector("input").value||0;
  let qty=row.cells[3].querySelector("input").value||0;

  let total=price*qty*percent/100;
  row.querySelector(".sum").innerText=total.toFixed(2);
}

// ===== เพิ่มแถว =====
function add(){
  let table=document.getElementById("tbl");
  let row=table.insertRow();

  row.innerHTML=`
<td><input></td>
<td><input type="number" value="0" oninput="calc(this)"></td>
<td><input type="number" value="0" oninput="calc(this)"></td>
<td><input type="number" value="1" oninput="calc(this)"></td>
<td class="sum">0</td>
<td><button class="delete" onclick="delRow(this)">ลบ</button></td>`;
}

// ===== ลบแถว =====
function delRow(btn){
  btn.closest("tr").remove();
}

// ===== Export Excel =====
function exportExcel(){
  let wb=XLSX.utils.table_to_book(document.getElementById("tbl"));
  XLSX.writeFile(wb,"percent_commission.xlsx");
}

</script>

</body>
</html>
