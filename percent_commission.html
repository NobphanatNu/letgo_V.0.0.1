<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<title>Commission</title>

<link href="https://fonts.googleapis.com/css2?family=TH+Sarabun+New&display=swap" rel="stylesheet">

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  font-family: 'TH Sarabun New', sans-serif;
  background: #f4f4f9;
}

/* ===== HEADER ===== */
header {
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  background: #333;
  color: white;
  z-index: 1000;
}

.header-top {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 12px 20px;
}

.title {
  font-size: 20px;
  font-weight: bold;
}

.user-area {
  display: flex;
  align-items: center;
  gap: 15px;
}

.logout {
  background: #e74c3c;
  padding: 6px 12px;
  border-radius: 5px;
  color: white;
  text-decoration: none;
}

.logout:hover {
  background: #c0392b;
}

.header-nav {
  display: flex;
  gap: 10px;
  padding: 8px 20px;
  background: #444;
}

.header-nav a {
  color: white;
  text-decoration: none;
  padding: 6px 14px;
  border-radius: 5px;
}

.header-nav a.active,
.header-nav a:hover {
  background: #666;
}

/* ===== CONTENT ===== */
.container {
  margin-top: 130px;
  padding: 20px;
}

h1 {
  text-align: center;
  margin-bottom: 20px;
}

/* ===== TABLE ===== */
table {
  width: 100%;
  border-collapse: collapse;
  background: white;
  table-layout: fixed;
}

th, td {
  border: 1px solid #ccc;
  padding: 10px;
  text-align: center;
}

th {
  background: #eee;
}

input {
  width: 100%;
  padding: 6px;
  font-size: 16px;
  border: 1px solid #ccc;
  border-radius: 4px;
}

.product-name input {
  text-align: left;
}

/* จำนวน */
.qty {
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 6px;
}

.qty input {
  width: 60px;
  text-align: center;
}

.qty button {
  width: 28px;
  height: 28px;
  border: none;
  border-radius: 50%;
  background: #555;
  color: white;
  cursor: pointer;
}

.qty button:hover {
  background: #333;
}

/* ปุ่ม */
.add-row {
  margin-top: 15px;
  padding: 8px 16px;
  background: #27ae60;
  color: white;
  border: none;
  border-radius: 5px;
  cursor: pointer;
}

.delete {
  background: #e74c3c;
  color: white;
  border: none;
  padding: 6px 10px;
  border-radius: 5px;
  cursor: pointer;
}

/* ===== SUMMARY ===== */
.summary {
  margin-top: 20px;
  padding: 16px 20px;
  background: #fff;
  border: 2px solid #27ae60;
  border-radius: 8px;
  font-size: 20px;
  font-weight: bold;
  display: flex;
  justify-content: space-between;
}

/* ===== FOOTER ===== */
.footer {
  position: fixed;
  bottom: 15px;
  right: 20px;
  color: #444;
}
</style>
</head>

<body>

<header>
  <div class="header-top">
    <div class="title">เว็บไซต์บันทึกและคำนวณค่าคอมมิชชั่น</div>
    <div class="user-area">
      ผู้ใช้งาน: <strong>Admin</strong>
      <a href="/index.html" class="logout">Logout</a>
    </div>
  </div>

  <nav class="header-nav">
    <a href="/Dashboard.html">หน้าหลัก</a>
    <a href="/fixed_commission.html">คำนวณค่าคอมตายตัว</a>
    <a href="/percent_commission.html" class="active">คำนวณค่าคอมเปอร์เซ็นต์</a>
  </nav>
</header>

<div class="container">
  <h1>คำนวณค่าคอมมิชชั่นแบบเปอร์เซ็นต์</h1>

  <table id="tbl">
    <colgroup>
      <col style="width:5%">
      <col style="width:25%">
      <col style="width:15%">
      <col style="width:10%">
      <col style="width:10%">
      <col style="width:15%">
      <col style="width:10%">
      <col style="width:10%">
    </colgroup>

    <tr>
      <th>ลำดับ</th>
      <th>ชื่อสินค้า</th>
      <th>ราคาขาย/ชิ้น</th>
      <th>% คอม</th>
      <th>จำนวน</th>
      <th>ยอดขาย</th>
      <th>ค่าคอม</th>
      <th>จัดการ</th>
    </tr>

    <tr>
      <td>1</td>
      <td class="product-name"><input type="text" placeholder="ชื่อสินค้า"></td>
      <td><input type="number" value="0" oninput="calc(this)"></td>
      <td><input type="number" value="0" oninput="calc(this)"></td>
      <td class="qty">
        <button onclick="chg(this,-1)">−</button>
        <input type="number" value="1" min="0" oninput="calc(this)">
        <button onclick="chg(this,1)">+</button>
      </td>
      <td class="sale">0</td>
      <td class="sum">0</td>
      <td><button class="delete" onclick="del(this)">ลบ</button></td>
    </tr>
  </table>

  <button class="add-row" onclick="add()">➕ เพิ่มรายการ</button>

  <div class="summary">
    <div>จำนวนที่ขายได้ทั้งหมด: <span id="totalQty">0</span> ชิ้น</div>
    <div>รวมค่าคอมทั้งหมด: <span id="grandTotal">0</span> บาท</div>
  </div>
</div>

<div class="footer">© Nobphanat | Version 0.0.1</div>

<script>
function calc(el) {
  const row = el.closest("tr");
  const price = parseFloat(row.cells[2].querySelector("input").value) || 0;
  const percent = parseFloat(row.cells[3].querySelector("input").value) || 0;
  const qty = parseInt(row.cells[4].querySelector("input").value) || 0;

  const sale = price * qty;
  const commission = sale * percent / 100;

  row.querySelector(".sale").innerText = sale;
  row.querySelector(".sum").innerText = commission;

  calcTotal();
}

function calcTotal() {
  let totalQty = 0;
  let totalCommission = 0;

  document.querySelectorAll("#tbl tr").forEach((row, i) => {
    if (i === 0) return;
    totalQty += parseInt(row.cells[4].querySelector("input").value) || 0;
    totalCommission += parseFloat(row.querySelector(".sum").innerText) || 0;
  });

  document.getElementById("totalQty").innerText = totalQty.toLocaleString();
  document.getElementById("grandTotal").innerText = totalCommission.toLocaleString();
}

function chg(btn, val) {
  const input = btn.parentNode.querySelector("input");
  input.value = Math.max(0, (parseInt(input.value) || 0) + val);
  calc(input);
}

function add() {
  const table = document.getElementById("tbl");
  const rowCount = table.rows.length;
  const row = table.insertRow();

  row.innerHTML = `
    <td>${rowCount}</td>
    <td class="product-name"><input type="text" placeholder="ชื่อสินค้า"></td>
    <td><input type="number" value="0" oninput="calc(this)"></td>
    <td><input type="number" value="0" oninput="calc(this)"></td>
    <td class="qty">
      <button onclick="chg(this,-1)">−</button>
      <input type="number" value="1" min="0" oninput="calc(this)">
      <button onclick="chg(this,1)">+</button>
    </td>
    <td class="sale">0</td>
    <td class="sum">0</td>
    <td><button class="delete" onclick="del(this)">ลบ</button></td>
  `;
  calcTotal();
}

function del(btn) {
  btn.closest("tr").remove();
  updateIndex();
  calcTotal();
}

function updateIndex() {
  document.querySelectorAll("#tbl tr").forEach((row, i) => {
    if (i > 0) row.cells[0].innerText = i;
  });
}
</script>

</body>
</html>
