<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<title>คอมเปอร์เซ็นต์</title>

<link href="https://fonts.googleapis.com/css2?family=TH+Sarabun+New&display=swap" rel="stylesheet">

<style>
body{font-family:'TH Sarabun New',sans-serif;background:#f4f4f9;margin:0;}
header{position:fixed;top:0;left:0;width:100%;height:70px;background:#333;color:#fff;
display:flex;justify-content:space-between;align-items:center;padding:0 20px;box-sizing:border-box;}
nav a{color:#ddd;text-decoration:none;padding:6px 12px;border-radius:5px;}
nav a.active,nav a:hover{background:#555;color:#fff;}
.container{max-width:400px;background:#fff;margin:120px auto;padding:25px;border-radius:10px;}
input,button{width:100%;padding:10px;margin-top:10px;}
button{background:#3498db;color:#fff;border:none;border-radius:5px;}
.result{text-align:center;margin-top:20px;font-size:20px;}
</style>
</head>

<body>

<header>
  <strong>คำนวณค่าคอมมิชชั่น</strong>
  <nav>
    <a href="/Dashboard.html">หน้าหลัก</a>
    <a href="/fixed_commission.html">คอมตายตัว</a>
    <a href="/percent_commission.html" class="active">คอมเปอร์เซ็นต์</a>
  </nav>
</header>

<div class="container">
  <h2>คำนวณค่าคอมเปอร์เซ็นต์</h2>
  <input type="number" id="price" placeholder="ยอดขาย">
  <input type="number" id="percent" placeholder="เปอร์เซ็นต์">
  <button onclick="calc()">คำนวณ</button>
  <div class="result" id="result"></div>
</div>

<script>
function calc(){
  let p=document.getElementById("price").value;
  let per=document.getElementById("percent").value;
  document.getElementById("result").innerHTML =
    "ค่าคอมที่ได้ = <b>" + (p*per/100).toLocaleString() + "</b> บาท";
}
</script>

</body>
</html>
