<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Percent Commission</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

<style>
body{
  margin:0;
  font-family:Arial, sans-serif;
  background:#f4f6f9;
}

/* Header */
header{
  background:#34495e;
  color:white;
  padding:12px 20px;
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.menu-btn{
  cursor:pointer;
  font-size:22px;
}

/* Side Menu */
#sideMenu{
  position:fixed;
  top:0;
  left:-250px;
  width:250px;
  height:100%;
  background:#2c3e50;
  color:white;
  padding-top:60px;
  transition:.3s;
  z-index:1000;
}

#sideMenu a{
  display:block;
  padding:12px 20px;
  color:white;
  text-decoration:none;
}

#sideMenu a:hover{
  background:#34495e;
}

#sideMenu.show{
  left:0;
}

/* overlay */
#overlay{
  position:fixed;
  top:0;
  left:0;
  width:100%;
  height:100%;
  background:rgba(0,0,0,0.4);
  display:none;
  z-index:900;
}

#overlay.show{
  display:block;
}

.user-box{
  display:flex;
  align-items:center;
  gap:10px;
}

.logout-btn{
  background:#e74c3c;
  color:white;
  border:none;
  padding:6px 12px;
  border-radius:6px;
  cursor:pointer;
}

/* Container */
.container{
  padding:20px;
  max-width:950px;
  margin:auto;
}

/* Table */
table{
  width:100%;
  border-collapse:collapse;
  background:white;
  border-radius:10px;
  overflow:hidden;
  box-shadow:0 4px 12px rgba(0,0,0,.08);
}

th{
  background:#f1f3f6;
}

th,td{
  padding:12px;
  text-align:center;
  border-bottom:1px solid #eee;
}

input{
  padding:6px;
  width:100%;
  border:1px solid #ccc;
  border-radius:6px;
}

/* Qty */
.qty-wrap{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:6px;
}

.qty-btn{
  padding:4px 8px;
  background:#e0e0e0;
  border:none;
  border-radius:6px;
  cursor:pointer;
}

/* Buttons */
.add-btn{
  background:#3498db;
  color:white;
  padding:8px 14px;
  border:none;
  border-radius:6px;
  cursor:pointer;
}

.export-btn{
  background:#27ae60;
  color:white;
  padding:8px 14px;
  border:none;
  border-radius:6px;
  cursor:pointer;
}

.delete-btn{
  background:#e74c3c;
  color:white;
  padding:6px 10px;
  border:none;
  border-radius:6px;
  cursor:pointer;
}

/* Total */
.total-box{
  text-align:right;
  font-size:18px;
  margin-top:15px;
  font-weight:bold;
}

/* Footer */
.copyright{
  position:fixed;
  bottom:8px;
  right:12px;
  font-size:12px;
  color:#555;
}
</style>
</head>

<body>

<div id="sidebar" class="sidebar">
  <a href="dashboard.html">หน้าหลัก</a>
  <a href="fixed_commission.html">ค่าคอมตายตัว</a>
  <a href="percent_commission.html">ค่าคอมเปอร์เซ็นต์</a>
</div>

<div id="overlay" onclick="toggleMenu()"></div>

<header>

<div>
<span class="menu-btn" onclick="toggleMenu()">☰</span>
Percent Commission
</div>

<div class="user-box">
<span id="user"></span>
<button class="logout-btn" onclick="logout()">Logout</button>
</div>

</header>

<div class="container">

<table id="tbl">
<tr>
<th style="width:30%">สินค้า</th>
<th style="width:15%">ราคา</th>
<th style="width:10%">%</th>
<th style="width:20%">จำนวน</th>
<th style="width:15%">ค่าคอม</th>
<th style="width:10%">ลบ</th>
</tr>

<tr>
<td><input></td>
<td><input type="number" value="0" oninput="calc(this)"></td>
<td><input type="number" value="0" oninput="calc(this)"></td>
<td>
<div class="qty-wrap">
<button class="qty-btn" onclick="changeQty(this,-1)">-</button>
<input type="number" value="1" oninput="calc(this)" style="width:60px">
<button class="qty-btn" onclick="changeQty(this,1)">+</button>
</div>
</td>
<td class="sum">0</td>
<td><button class="delete-btn" onclick="removeRow(this)">X</button></td>
</tr>

</table>

<br>
<button class="add-btn" onclick="add()">เพิ่มแถว</button>
<button class="export-btn" onclick="exportExcel()">Export Excel</button>

<div class="total-box">
รวมค่าคอมทั้งหมด: <span id="grandTotal">0</span>
</div>

</div>

<div class="copyright">
© Nobphanat | Version 0.1.1
</div>

<script>

document.getElementById("user").innerText =
"ผู้ใช้งาน: " + localStorage.getItem("loginUser");

function logout(){
 localStorage.removeItem("loginUser");
 location="index.html";
}

function toggleMenu(){
 document.getElementById("sideMenu").classList.toggle("show");
 document.getElementById("overlay").classList.toggle("show");
}

function calc(el){
 let row=el.closest("tr");
 let price=row.cells[1].querySelector("input").value||0;
 let percent=row.cells[2].querySelector("input").value||0;
 let qty=row.cells[3].querySelector("input").value||0;

 let total=price*qty*percent/100;
 row.querySelector(".sum").innerText=total.toFixed(2);
 totalAll();
}

function totalAll(){
 let sums=document.querySelectorAll(".sum");
 let total=0;
 sums.forEach(s=> total+=Number(s.innerText)||0);
 document.getElementById("grandTotal").innerText=total.toFixed(2);
}

function changeQty(btn,delta){
 let input=btn.parentElement.querySelector("input");
 input.value=Math.max(0,Number(input.value)+delta);
 calc(input);
}

function removeRow(btn){
 btn.closest("tr").remove();
 totalAll();
}

function add(){
 let table=document.getElementById("tbl");
 let row=table.insertRow();
 row.innerHTML=`
<td><input></td>
<td><input type="number" value="0" oninput="calc(this)"></td>
<td><input type="number" value="0" oninput="calc(this)"></td>
<td>
<div class="qty-wrap">
<button class="qty-btn" onclick="changeQty(this,-1)">-</button>
<input type="number" value="1" oninput="calc(this)" style="width:60px">
<button class="qty-btn" onclick="changeQty(this,1)">+</button>
</div>
</td>
<td class="sum">0</td>
<td><button class="delete-btn" onclick="removeRow(this)">X</button></td>`;
}

function exportExcel(){
 let wb=XLSX.utils.table_to_book(document.getElementById("tbl"));
 XLSX.writeFile(wb,"percent_commission.xlsx");
}

</script>

</body>
</html>
