<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Percent Commission</title>

<style>
body{margin:0;font-family:Arial;background:#f4f6f9;}
header{background:#34495e;color:white;padding:12px 18px;display:flex;justify-content:space-between;align-items:center;}
.left-head{display:flex;align-items:center;gap:12px;}
.menu-btn{font-size:20px;cursor:pointer;}
.user-box{display:flex;align-items:center;gap:12px;}
button{padding:6px 10px;border:none;background:#e74c3c;color:white;border-radius:6px;cursor:pointer;}
button:hover{background:#c0392b;}
.container{max-width:900px;margin:25px auto;background:white;padding:20px;border-radius:12px;box-shadow:0 4px 14px rgba(0,0,0,.08);}
table{width:100%;border-collapse:collapse;}
th{background:#ecf0f1;padding:12px;}
td{padding:8px;border-bottom:1px solid #eee;text-align:center;}
input{width:100%;padding:6px;border:1px solid #ccc;border-radius:6px;text-align:center;}
.qty-box{display:flex;align-items:center;gap:4px;justify-content:center;}
.qty-btn{background:#3498db;padding:4px 8px;}
.delete-btn{background:#e74c3c;}
.total-row td{font-weight:bold;font-size:18px;background:#fafafa;}
.add-btn{margin-top:12px;background:#3498db;}
.footer{position:fixed;right:12px;bottom:6px;font-size:12px;color:#666;}
</style>
</head>

<body>

<header>
  <div class="left-head">
    <div class="menu-btn" onclick="location='dashboard.html'">☰</div>
    <div>Percent Commission</div>
  </div>

  <div class="user-box">
    <span id="welcome"></span>
    <button onclick="logout()">Logout</button>
  </div>
</header>

<div class="container">

<table>
<thead>
<tr>
<th>สินค้า</th>
<th>จำนวน</th>
<th>%</th>
<th>ราคา</th>
<th>รวม</th>
<th>ลบ</th>
</tr>
</thead>

<tbody id="tableBody"></tbody>

<tfoot>
<tr class="total-row">
<td colspan="4">รวมทั้งหมด</td>
<td id="grandTotal">0</td>
<td></td>
</tr>
</tfoot>
</table>

<button class="add-btn" onclick="addRow()">เพิ่มแถว</button>

</div>

<div class="footer">Commission System V0.1.1 © Nobphanat</div>

<script>
const user = localStorage.getItem("loginUser");
if(!user){ location="index.html"; }
document.getElementById("welcome").innerText="ผู้ใช้งาน: "+user;

function logout(){
  localStorage.removeItem("loginUser");
  location="index.html";
}

function calculate(){
  let rows=document.querySelectorAll("#tableBody tr");
  let grand=0;

  rows.forEach(row=>{
    let qty=row.querySelector(".qty").value||0;
    let percent=row.querySelector(".percent").value||0;
    let price=row.querySelector(".price").value||0;

    let total=(qty*price*percent)/100;
    row.querySelector(".rowTotal").innerText=total.toFixed(2);
    grand+=total;
  });

  document.getElementById("grandTotal").innerText=grand.toFixed(2);
}

function addRow(){
  let tr=document.createElement("tr");
  tr.innerHTML=`
  <td><input type="text"></td>

  <td>
    <div class="qty-box">
      <button class="qty-btn" onclick="changeQty(this,-1)">-</button>
      <input type="number" class="qty" value="1" oninput="calculate()">
      <button class="qty-btn" onclick="changeQty(this,1)">+</button>
    </div>
  </td>

  <td><input type="number" class="percent" value="0" oninput="calculate()"></td>
  <td><input type="number" class="price" value="0" oninput="calculate()"></td>
  <td class="rowTotal">0</td>
  <td><button class="delete-btn" onclick="deleteRow(this)">ลบ</button></td>
  `;
  document.getElementById("tableBody").appendChild(tr);
}

function deleteRow(btn){
  btn.closest("tr").remove();
  calculate();
}

function changeQty(btn,delta){
  let input=btn.parentElement.querySelector(".qty");
  let val=parseInt(input.value)||0;
  val+=delta;
  if(val<1) val=1;
  input.value=val;
  calculate();
}

addRow();
</script>

</body>
</html>
