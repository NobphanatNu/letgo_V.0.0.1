<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<title>คำนวณค่าคอมเปอร์เซ็นต์</title>

<link href="https://fonts.googleapis.com/css2?family=TH+Sarabun+New&display=swap" rel="stylesheet">

<style>
body {
  font-family: 'TH Sarabun New', sans-serif;
  background: #f4f4f9;
  margin: 0;
}

header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  background: #333;
  color: white;
  padding: 15px 20px;
}

nav a {
  color: #ddd;
  text-decoration: none;
  padding: 6px 12px;
  border-radius: 5px;
}

nav a.active,
nav a:hover {
  background: #555;
  color: #fff;
}

.container {
  max-width: 400px;
  background: white;
  margin: 50px auto;
  padding: 25px;
  border-radius: 10px;
}

input, button {
  width: 100%;
  padding: 10px;
  margin-top: 10px;
  font-size: 16px;
}

button {
  background: #3498db;
  color: white;
  border: none;
  border-radius: 5px;
}

.result {
  margin-top: 20px;
  font-size: 20px;
  text-align: center;
}
</style>
</head>

<body>

<header>
  <strong>คำนวณค่าคอมมิชชั่น</strong>
  <nav>
    <a href="dashboard.html">หน้าหลัก</a>
    <a href="fixed_commission.html">คอมตายตัว</a>
    <a href="percent_commission.html" class="active">คอมเปอร์เซ็นต์</a>
  </nav>
</header>

<div class="container">
  <h2>คำนวณค่าคอมเปอร์เซ็นต์</h2>

  <input type="number" id="price" placeholder="ยอดขาย (บาท)">
  <input type="number" id="percent" placeholder="เปอร์เซ็นต์ค่าคอม (%)">

  <button onclick="calculate()">คำนวณ</button>

  <div class="result" id="result"></div>
</div>

<script>
function calculate() {
  let price = document.getElementById("price").value;
  let percent = document.getElementById("percent").value;

  let total = price * percent / 100;

  document.getElementById("result").innerHTML =
    "ค่าคอมที่ได้ = <strong>" + total.toLocaleString() + "</strong> บาท";
}
</script>

</body>
</html>
